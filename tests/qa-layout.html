<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晴序布局检查 · 开发专用</title><style>body{margin:0;background:#172d44;color:white;font:12px system-ui}nav{display:flex;gap:6px;padding:10px;position:sticky;top:0;background:#172d44;z-index:1}button{padding:8px;background:#477697;color:#fff;border:0;border-radius:5px}#box{overflow:hidden;position:relative}iframe{border:0;transform-origin:top left;display:block}output{padding:10px;display:block;font-size:10px}</style><nav><button data-width="390">手机390</button><button data-width="820">平板820</button><button data-width="1440">桌面1440</button></nav><output id="info"></output><div id="box"><iframe title="真实天气网站响应式预览" src="/" width="1440" height="2100"></iframe></div><script>const frame=document.querySelector('iframe'),box=document.querySelector('#box');let width=1440;function layout(){const scale=Math.min(1,innerWidth/width);frame.width=width;frame.style.transform=`scale(${scale})`;box.style.height=`${2100*scale}px`;setTimeout(()=>{const doc=frame.contentDocument;document.querySelector('#info').textContent=`视口 ${width}px · 内容 ${doc.documentElement.scrollWidth}px · ${doc.documentElement.scrollWidth>width?'存在横向溢出':'无横向溢出'}`;},300);}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{width=Number(b.dataset.width);layout()});frame.onload=layout;onresize=layout;</script></html>
